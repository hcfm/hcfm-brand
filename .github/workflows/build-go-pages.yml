name: Rebuild banner redirect pages

# Marketing changes where a banner click lands by editing one line in
# email-banners/campaigns.yml, in the GitHub web UI or through Banner Studio.
# This workflow turns that edit into the two things that actually serve the
# click, so the manifest and what a recipient reaches can never disagree:
#
#   1. banner-studio/vercel.json  the REAL redirect. Vercel answers /go/<key>
#      with an HTTP 302 at the edge. No document is parsed, nothing is painted,
#      the recipient goes straight from the email to the destination. This is
#      what installed signatures should point at.
#
#   2. go/<key>/index.html        the legacy path on GitHub Pages, kept alive
#      only for signatures pasted before the switch. Static hosting cannot
#      issue a 302, so this can only ever be a document that redirects itself,
#      and the browser keeps painting it until the destination answers. On 26
#      August staff reported that as being dumped on a random blue page for
#      seconds. It is now stripped of everything visible, so the worst case is
#      a blank frame rather than a branded detour. It is deprecated: once no
#      signature points here, delete it.

on:
  push:
    branches: [main]
    paths:
      - 'email-banners/campaigns.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-go-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate the redirect layer from the manifest
        run: |
          python3 - <<'PY'
          import html, json, os, urllib.parse

          def manifest(path="email-banners/campaigns.yml"):
              out, key = {}, None
              for raw in open(path, encoding="utf-8"):
                  line = raw.rstrip("\n")
                  if not line.strip() or line.lstrip().startswith("#"):
                      continue
                  if not line.startswith((" ", "\t")):
                      key = line.split(":", 1)[0].strip()
                      out[key] = {}
                  elif key:
                      k, _, v = line.strip().partition(":")
                      out[key][k.strip()] = v.strip().strip('"').strip("'")
              return out

          def tagged(meta, key):
              dest = meta["destination"]
              return dest + ("&" if "?" in dest else "?") + urllib.parse.urlencode({
                  "utm_source":   "email-signature",
                  "utm_medium":   "email",
                  "utm_campaign": meta.get("campaign", "unspecified"),
                  "utm_content":  key,
              })

          data = manifest()

          # ---------- 1. The real redirect, served by Vercel ----------
          VERCEL = "banner-studio/vercel.json"
          cfg = json.load(open(VERCEL, encoding="utf-8"))
          redirects = []
          for key, meta in sorted(data.items()):
              url = tagged(meta, key)
              # Both spellings, so a trailing slash never costs an extra hop.
              for src in (f"/go/{key}", f"/go/{key}/"):
                  redirects.append({
                      "source": src,
                      "destination": url,
                      # MUST stay false. A permanent redirect is a 308 and browsers
                      # cache it effectively forever, which would make the next
                      # campaign change invisible to anyone who clicked the last one.
                      "permanent": False,
                  })
          cfg["redirects"] = redirects
          with open(VERCEL, "w", encoding="utf-8") as f:
              json.dump(cfg, f, indent=2)
              f.write("\n")
          print("Wrote %d redirect rules to %s" % (len(redirects), VERCEL))

          # ---------- 2. The deprecated GitHub Pages fallback ----------
          # Nothing visible. No colour, no wordmark, no message. If both the
          # script and the meta refresh are stripped by a mail gateway, a plain
          # link fades in after three seconds so nobody is stranded.
          PAGE = """<!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <script>location.replace("__TAGGED__");</script>
          <meta http-equiv="refresh" content="0; url=__TAGGED_ESC__">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <meta name="robots" content="noindex, nofollow">
          <title>__LABEL__</title>
          <link rel="canonical" href="__DEST__">
          <style>
            :root { color-scheme: light; }
            html, body { background:#fff; margin:0; height:100%; }
            .fallback { visibility:hidden; animation:show 0s linear 3000ms forwards;
              font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
              font-size:15px; color:#1a1a1a; padding:28px; text-align:center; }
            @keyframes show { to { visibility:visible; } }
            .fallback a { color:#0047BB; }
          </style>
          </head>
          <body>
            <p class="fallback"><a href="__TAGGED_ESC__">Continue to __LABEL__</a></p>
          </body>
          </html>
          """
          PAGE = "\n".join(l[10:] if l.startswith(" " * 10) else l for l in PAGE.split("\n"))

          written = 0
          for key, meta in sorted(data.items()):
              url = tagged(meta, key)
              out = (PAGE
                     .replace("__LABEL__",      html.escape(meta.get("label", key)))
                     .replace("__DEST__",       meta["destination"])
                     .replace("__TAGGED_ESC__", url.replace("&", "&amp;"))
                     .replace("__TAGGED__",     url))
              d = os.path.join("go", key)
              os.makedirs(d, exist_ok=True)
              open(os.path.join(d, "index.html"), "w", encoding="utf-8").write(out)
              print("  go/%s/index.html -> %s" % (key, url))
              written += 1
          print("Wrote %d fallback pages." % written)
          PY

      - name: Commit if anything changed
        run: |
          if [ -z "$(git status --porcelain go/ banner-studio/vercel.json)" ]; then
            echo "Redirect layer already matches campaigns.yml. Nothing to commit."
            exit 0
          fi
          git config user.name  "hcfm-banner-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go/ banner-studio/vercel.json
          git commit -m "Rebuild redirect layer from campaigns.yml"
          git push

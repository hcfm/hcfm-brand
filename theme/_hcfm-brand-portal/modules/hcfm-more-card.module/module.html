{# HCFM More Card — The rest of the system navigation grid on Home.
   Update number, title, description, and link in the HubSpot editor. #}
<a class="more-card" href="{{ module.card_href }}">
  <span class="more-num">{{ module.card_number }}</span>
  <div class="more-text">
    <h3>{{ module.card_title }}</h3>
    <p>{{ module.card_description }}</p>
  </div>
  <span class="more-arrow">→</span>
</a>

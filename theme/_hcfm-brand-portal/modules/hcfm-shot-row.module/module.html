{# HCFM Event Shot List Item — Imagery section.
   Update shot number, shot type, and guidance in the HubSpot editor.
   To add a new shot type, duplicate this module and fill in the new content. #}
<article class="shot-row">
  <span class="shot-num">{{ module.shot_number }}</span>
  <div class="shot-text">
    <h3>{{ module.shot_title }}</h3>
    {{ module.shot_body }}
  </div>
</article>

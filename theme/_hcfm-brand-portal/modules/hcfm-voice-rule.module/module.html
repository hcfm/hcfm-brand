{# HCFM Voice Rule — one voice principle. Renders a full <li> for use inside
   .voice-list in the Voice section. Both title and body are editable fields. #}

  {% if module.rule_title %}<strong>{{ module.rule_title }}</strong>{% endif %}
  {% if module.rule_body %}{{ module.rule_body }}{% endif %}
</li>
